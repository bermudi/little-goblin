<style>
	:root {
		--bg: #0d0d0d;
		--fg: #e8e8ea;
		--fg-muted: color-mix(in oklab, var(--fg) 62%, var(--bg));
		--fg-subtle: color-mix(in oklab, var(--fg) 48%, var(--bg));
		--border: color-mix(in oklab, var(--fg) 1.5%, transparent);
		--divider: color-mix(in oklab, var(--fg) 8%, transparent);
		--hover: color-mix(in oklab, var(--fg) 6%, transparent);
		--active: color-mix(in oklab, var(--fg) 7%, transparent);
		--active-strong: color-mix(in oklab, var(--fg) 11%, transparent);
		--accent: #a78bfa;
		--sans: "Inter", -apple-system, BlinkMacSystemFont, ui-sans-serif, system-ui, sans-serif;
		--mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
		color-scheme: dark;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; background: #080808; color: var(--fg); }
	body {
		font-family: var(--sans); font-size: 13px; line-height: 1.45;
		-webkit-font-smoothing: antialiased;
		min-height: 100dvh;
		display: flex; flex-direction: column; align-items: center; justify-content: center;
		padding: 2rem 1rem;
		gap: 1rem;
	}
	button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
	a { color: inherit; text-decoration: none; }
	:focus-visible { outline: 1px solid color-mix(in oklab, var(--fg) 40%, transparent); outline-offset: -1px; }
	@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

	figcaption {
		font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.02em;
		color: var(--fg-subtle); text-align: center; max-width: 30rem;
	}

	/* ---------- phone ---------- */
	.phone {
		position: relative;
		width: 390px; height: 844px; flex: none;
		background: var(--bg);
		border: 1px solid var(--divider);
		border-radius: 46px;
		overflow: hidden;
		display: flex; flex-direction: column;
	}
	.statusbar {
		flex: none; height: 44px;
		display: flex; align-items: center; justify-content: space-between;
		padding: 0 1.6rem 0 2rem;
		color: var(--fg);
	}
	.statusbar .time { font-family: var(--mono); font-size: 12px; font-weight: 600; }
	.statusbar svg { display: block; }

	.screens { flex: 1; min-height: 0; position: relative; }
	.page { position: absolute; inset: 0; display: none; flex-direction: column; }
	.page.on { display: flex; }

	.pagebar {
		flex: none; height: 52px;
		display: flex; align-items: center; gap: 0.55rem;
		padding: 0 0.75rem 0 1.1rem;
	}
	.pagebar h1 { font-size: 15px; font-weight: 600; margin: 0; }
	.pagebar .brand { font-size: 15px; font-weight: 600; }
	.pagebar .title { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.pagebar .spacer { flex: 1; }
	.icon-btn {
		width: 2.25rem; height: 2.25rem; flex: none;
		display: inline-flex; align-items: center; justify-content: center;
		border-radius: 9px; color: var(--fg-muted);
	}
	.icon-btn:hover { background: var(--hover); color: var(--fg); }

	/* ---------- lists ---------- */
	.list { flex: 1; min-height: 0; overflow-y: auto; padding: 0.15rem 0.5rem 0.75rem; }
	.list ul, .rows ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
	.conv {
		display: block; width: 100%;
		padding: 0.48rem 0.6rem;
		border-radius: 10px;
		text-decoration: none;
	}
	.conv:hover { background: var(--hover); }
	.conv.current { background: var(--active); }
	.conv-head { display: flex; align-items: baseline; gap: 0.45rem; }
	.conv-pin { flex: none; align-self: center; color: var(--fg-subtle); }
	.conv-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.conv-time { flex: none; font-family: var(--mono); font-size: 10px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
	.conv-preview { display: block; margin-top: 1px; color: var(--fg-muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

	.archived-toggle {
		display: flex; align-items: center; gap: 0.4rem;
		width: 100%; text-align: left;
		margin-top: 0.35rem;
		padding: 0.45rem 0.6rem;
		border-radius: 10px;
		font-size: 12px;
		color: var(--fg-subtle);
	}
	.archived-toggle:hover { background: var(--hover); color: var(--fg-muted); }
	.archived-toggle .count { font-family: var(--mono); font-size: 10px; }
	.archived-toggle .chev { margin-left: auto; transition: transform 120ms ease; }
	.archived-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
	.list ul.archived-list { display: none; }
	.list ul.archived-list.open { display: flex; }
	.drawer ul.archived-list { display: none; }
	.drawer ul.archived-list.open { display: flex; }

	.rows { flex: 1; min-height: 0; overflow-y: auto; padding: 0.2rem 0.5rem 0.75rem; }
	.line-row {
		display: flex; align-items: center; gap: 0.5rem;
		width: 100%; min-height: 2.5rem; text-align: left;
		padding: 0.45rem 0.6rem;
		border-radius: 10px;
		font-size: 13px;
		color: var(--fg-muted);
	}
	.line-row:hover { background: var(--hover); color: var(--fg); }
	.line-row .t { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--fg-subtle); }
	.ghost-row {
		display: flex; align-items: center; gap: 0.5rem;
		width: 100%; min-height: 2.5rem; text-align: left;
		padding: 0.45rem 0.6rem;
		border-radius: 10px;
		font-size: 13px;
		color: var(--fg-subtle);
	}
	.ghost-row:hover { background: var(--hover); color: var(--fg-muted); }

	.stub { flex: 1; min-height: 0; overflow-y: auto; padding: 0.6rem 1rem; display: flex; flex-direction: column; gap: 0.55rem; }
	.stub .bar { height: 9px; border-radius: 5px; background: var(--hover); }
	.stub .note { font-family: var(--mono); font-size: 9.5px; color: var(--fg-subtle); margin-top: 0.4rem; }

	/* ---------- thread ---------- */
	.transcript { flex: 1; min-height: 0; overflow-y: auto; padding: 0.75rem 1rem; }
	.msg { margin-bottom: 1rem; }
	.who { font-family: var(--mono); font-size: 10px; color: var(--fg-subtle); margin-bottom: 0.2rem; }
	.msg p { margin: 0; }
	.composer { flex: none; padding: 0.6rem 1rem 2.1rem; }
	.composer .field { border: 1px solid var(--divider); border-radius: 12px; padding: 0.6rem 0.8rem; color: var(--fg-subtle); }

	/* ---------- drawer ---------- */
	.drawer-scrim {
		position: absolute; inset: 0; z-index: 40;
		background: rgba(0, 0, 0, 0.45);
		opacity: 0; pointer-events: none;
		transition: opacity 160ms ease;
	}
	.drawer-scrim.open { opacity: 1; pointer-events: auto; }
	.drawer {
		position: absolute; top: 0; bottom: 0; left: 0; z-index: 50;
		width: min(82vw, 306px);
		background: var(--bg);
		border-right: 1px solid var(--divider);
		transform: translateX(-106%);
		visibility: hidden;
		transition: transform 170ms ease, visibility 0s linear 170ms;
		display: flex; flex-direction: column;
		padding: 0.6rem 0.55rem 1.5rem;
		gap: 0.3rem;
		overflow-y: auto;
	}
	.drawer.open { transform: none; visibility: visible; transition: transform 170ms ease; }
	.new-btn {
		display: flex; align-items: center; gap: 0.5rem;
		width: 100%; text-align: left;
		padding: 0.5rem 0.6rem;
		border-radius: 10px;
		background: var(--active);
		font-weight: 500;
	}
	.new-btn:hover { background: var(--active-strong); }
	.new-btn svg { color: var(--fg-muted); flex: none; }
	.drawer-search {
		font: inherit; font-size: 12.5px;
		background: var(--active);
		border: 1px solid transparent;
		border-radius: 10px;
		color: var(--fg);
		padding: 0.42rem 0.7rem;
		outline: none;
	}
	.drawer-search:focus { border-color: color-mix(in oklab, var(--fg) 20%, transparent); background: transparent; }
	.drawer-search::placeholder { color: var(--fg-subtle); }

	.drawer ul { list-style: none; margin: 0.1rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
	.drawer-label {
		padding: 0.5rem 0.6rem 0.15rem;
		font-size: 10px; font-weight: 600;
		text-transform: uppercase; letter-spacing: 0.05em;
		color: var(--fg-subtle);
	}
	.drawer-row {
		display: flex; align-items: center; gap: 0.5rem;
		width: 100%; min-height: 2.4rem; text-align: left;
		padding: 0.4rem 0.6rem;
		border-radius: 10px;
		font-size: 13px;
		color: var(--fg-muted);
	}
	.drawer-row:hover { background: var(--hover); color: var(--fg); }
	.drawer-row.on { background: var(--active); color: var(--fg); }
	.drawer-row .t { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--fg-subtle); }
	.drawer-row .chev { margin-left: auto; color: var(--fg-subtle); }

	.drawer-split { width: 100%; height: 1px; background: var(--divider); margin: 0.55rem 0 0.2rem; flex: none; }
	.grid {
		display: grid; grid-template-columns: repeat(5, 1fr);
		gap: 1px;
		margin-top: 0.2rem;
	}
	.cell {
		display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
		padding: 0.42rem 0 0.34rem;
		border-radius: 10px;
		font-size: 9.5px;
		color: var(--fg-muted);
		position: relative;
	}
	.cell:hover { background: var(--hover); color: var(--fg); }
	.cell.on { background: var(--active); color: var(--fg); }
	.cell svg { display: block; }
	.cell .dot {
		position: absolute; top: 6px; right: calc(50% - 12px);
		width: 6px; height: 6px; border-radius: 50%;
		background: var(--accent);
	}

	.home-pill {
		position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
		width: 128px; height: 5px; border-radius: 3px;
		background: color-mix(in oklab, var(--fg) 30%, transparent);
		z-index: 60; pointer-events: none;
	}

	@media (max-height: 940px), (max-width: 440px) {
		body { padding: 1rem 0.5rem; }
		.phone { transform: scale(min(1, calc((100dvh - 6rem) / 844))); transform-origin: top center; }
	}
</style>
</head>

<script>
	const drawer = document.getElementById("drawer");
	const scrim = document.getElementById("drawerScrim");
	function setDrawer(open) {
		drawer.classList.toggle("open", open);
		scrim.classList.toggle("open", open);
	}
	document.getElementById("menuBtn").addEventListener("click", () => setDrawer(true));
	for (const b of document.querySelectorAll(".menu-open")) {
		b.addEventListener("click", () => setDrawer(true));
	}
	scrim.addEventListener("click", () => setDrawer(false));
	document.addEventListener("keydown", (e) => { if (e.key === "Escape") setDrawer(false); });

	const pages = [...document.querySelectorAll(".page")];
	function show(name) {
		for (const p of pages) p.classList.toggle("on", p.id === "page-" + name);
	}
	for (const a of document.querySelectorAll("[data-thread]")) {
		a.addEventListener("click", (e) => { e.preventDefault(); setDrawer(false); show("thread"); });
	}
	for (const b of document.querySelectorAll("[data-page]")) {
		b.addEventListener("click", () => { setDrawer(false); show(b.dataset.page); });
	}
	const moreTitle = document.getElementById("moreTitle");
	const moreNote = document.getElementById("moreNote");
	for (const c of document.querySelectorAll("[data-op]")) {
		c.addEventListener("click", () => {
			setDrawer(false);
			moreTitle.textContent = c.dataset.op;
			moreNote.textContent = c.dataset.op.toLowerCase() + " — stub";
			show("more");
		});
	}

	for (const id of ["archivedToggle", "archivedToggle2"]) {
		const t = document.getElementById(id);
		const list = document.getElementById(id === "archivedToggle" ? "archivedList" : "archivedList2");
		t.addEventListener("click", () => {
			const open = list.classList.toggle("open");
			t.setAttribute("aria-expanded", String(open));
		});
	}
</script>
