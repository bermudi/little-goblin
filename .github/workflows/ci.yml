name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Enforce comment baseline
        env:
          COMMENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$COMMENT_BASE"
          if [[ "$GITHUB_EVENT_NAME" == push ]] && ! git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
            base="$(git merge-base HEAD "refs/remotes/origin/$DEFAULT_BRANCH")"
          fi
          bun scripts/comment-audit.ts --check --base "$base"
      - run: bun run lint
      - run: python3 -m unittest discover -s deploy/memory -t deploy/memory

  # Each shard runs its files across the runner's cores (--parallel).
  # test-timings.json balances shards by measured time; each shard
  # uploads its fresh timings; scripts/refresh-test-timings.sh merges
  # them back into the committed file.
  test:
    runs-on: ubuntu-latest
    env:
      FFMPEG_VERSION: '8.1.3-2'
      FFMPEG_SHA256: '1df84d04c4322902dba81c290508cdf3d89524d210b9fe03154bea6c4e3bfbb6'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache FFmpeg archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ${{ runner.temp }}/ffmpeg.tar.xz
          key: ffmpeg-archive-${{ runner.os }}-${{ runner.arch }}-${{ env.FFMPEG_SHA256 }}
      - name: Set up FFmpeg and FFprobe
        timeout-minutes: 2
        shell: bash
        run: |
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          if [[ ! -f "$archive" ]]; then
            echo "Downloading FFmpeg $FFMPEG_VERSION from Jellyfin's GitHub release"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 45 --retry 2 --retry-max-time 60 \
              --output "$archive" \
              "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v${FFMPEG_VERSION}/jellyfin-ffmpeg_${FFMPEG_VERSION}_portable_linux64-gpl.tar.xz"
          fi
          # Verify cached bytes too, before extracting or executing either binary.
          printf '%s  %s\n' "$FFMPEG_SHA256" "$archive" | sha256sum --check
          bin="$RUNNER_TEMP/ffmpeg-bin"
          mkdir -p "$bin"
          tar -xJf "$archive" -C "$bin" ffmpeg ffprobe
          "$bin/ffmpeg" -version
          "$bin/ffprobe" -version
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun test --parallel --shard=${{ matrix.shard }}/4 --timings=.github/test-timings.json --update-timings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-timings-${{ matrix.shard }}
          path: .github/test-timings.json
