# dependsOn holds HARD edges only: this change's tasks directly consume a type,
# persisted format, or module interface introduced by the dependency.
# Soft edges (vocabulary, Non-Goals deferral, correctness sequencing) are
# recorded in ARCHITECTURE.md under "Implementation train", not here.
dependsOn:
  - telegram-surface-identity
  - immutable-project-environments
  - surface-derived-memory-context
  - transcript-surface-provenance
# surface-derived-memory-context and transcript-surface-provenance are hard
# correctness edges: lifecycle runtime assembly consumes CapturedMemoryContext,
# and intake/transcript writes consume TranscriptWriterContext. Without both,
# cross-Surface resume would retain stale memory authority or misattribute history.
# surface-skill-policy remains a soft edge (passive preservation only), and
# personal-attachment-intake remains a Non-Goals deferral.
