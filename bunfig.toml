# Bun runs every test file of one invocation in a single process, and
# scopes a module-level afterEach to the file whose import first
# registered it: without this preload, files after the first leak all
# of their testkit fixture dirs (2026-10-22 /tmp ENOSPC
# incident — 86k leaked dirs, ~15GB). Loading the fixture module
# before any test file makes its cleanup hooks global to the run.
[test]
# test-tmpdir.ts comes first: it points TMPDIR at RAM before anything
# reads os.tmpdir() (see its header). test-dom-print.ts keeps failed
# assertions on happy-dom nodes from printing the whole app (#798); it
# must load before anything imports bun:test (see its header).
preload = ["./src/test-tmpdir.ts", "./app/src/test-dom-print.ts", "./src/testkit.ts"]
