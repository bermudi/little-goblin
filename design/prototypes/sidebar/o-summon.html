<head>

<title>O — summoned spine · goblin mobile prototype</title>
<style>
	:root {
		--bg: #0d0d0d;
		--fg: #e8e8ea;
		--fg-muted: color-mix(in oklab, var(--fg) 62%, var(--bg));
		--fg-subtle: color-mix(in oklab, var(--fg) 48%, var(--bg));
		--border: color-mix(in oklab, var(--fg) 1.5%, transparent);
		--divider: color-mix(in oklab, var(--fg) 8%, transparent);
		--hover: color-mix(in oklab, var(--fg) 6%, transparent);
		--active: color-mix(in oklab, var(--fg) 7%, transparent);
		--active-strong: color-mix(in oklab, var(--fg) 11%, transparent);
		--raise: color-mix(in oklab, var(--bg) 90%, var(--fg));
		--accent: #a78bfa;
		--sans: "Inter", -apple-system, BlinkMacSystemFont, ui-sans-serif, system-ui, sans-serif;
		--mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
		color-scheme: dark;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; background: #080808; color: var(--fg); }
	body {
		font-family: var(--sans); font-size: 13px; line-height: 1.45;
		-webkit-font-smoothing: antialiased;
		min-height: 100dvh;
		display: flex; flex-direction: column; align-items: center; justify-content: center;
		padding: 2rem 1rem;
		gap: 1rem;
	}
	button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
	a { color: inherit; }
	:focus-visible { outline: 1px solid color-mix(in oklab, var(--fg) 40%, transparent); outline-offset: -1px; }
	@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

	figcaption {
		font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.02em;
		color: var(--fg-subtle); text-align: center; max-width: 30rem;
	}

	/* ---------- phone ---------- */
	.phone {
		position: relative;
		width: 390px; height: 844px; flex: none;
		background: var(--bg);
		border: 1px solid var(--divider);
		border-radius: 46px;
		overflow: hidden;
		display: flex; flex-direction: column;
	}
	.statusbar {
		flex: none; height: 44px;
		display: flex; align-items: center; justify-content: space-between;
		padding: 0 1.6rem 0 2rem;
		color: var(--fg);
	}
	.statusbar .time { font-family: var(--mono); font-size: 12px; font-weight: 600; }
	.statusbar svg { display: block; }

	.screens { flex: 1; min-height: 0; position: relative; }
	.page { position: absolute; inset: 0; display: none; flex-direction: column; }
	.page.on { display: flex; }

	.pagebar {
		flex: none; height: 52px;
		display: flex; align-items: center; gap: 0.55rem;
		padding: 0 0.75rem 0 1.1rem;
	}
	.pagebar h1 { font-size: 15px; font-weight: 600; margin: 0; }
	.pagebar .title { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.pagebar .spacer { flex: 1; }
	.icon-btn {
		width: 2.25rem; height: 2.25rem; flex: none;
		display: inline-flex; align-items: center; justify-content: center;
		border-radius: 9px; color: var(--fg-muted);
	}
	.icon-btn:hover { background: var(--hover); color: var(--fg); }

	/* ---------- lists ---------- */
	.search-row { flex: none; padding: 0.15rem 1rem 0.55rem; }
	.search-row input {
		width: 100%;
		font: inherit; font-size: 12.5px;
		background: var(--active);
		border: 1px solid transparent;
		border-radius: 10px;
		color: var(--fg);
		padding: 0.45rem 0.7rem;
		outline: none;
	}
	.search-row input:focus { border-color: color-mix(in oklab, var(--fg) 20%, transparent); background: transparent; }
	.search-row input::placeholder { color: var(--fg-subtle); }

	.list { flex: 1; min-height: 0; overflow-y: auto; padding: 0.15rem 0.5rem 0.75rem; }
	.list ul, .rows ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
	.conv {
		display: block; width: 100%;
		padding: 0.48rem 0.6rem;
		border-radius: 10px;
		text-decoration: none;
	}
	.conv:hover { background: var(--hover); }
	.conv.current { background: var(--active); }
	.conv-head { display: flex; align-items: baseline; gap: 0.45rem; }
	.conv-pin { flex: none; align-self: center; color: var(--fg-subtle); }
	.conv-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.conv-time { flex: none; font-family: var(--mono); font-size: 10px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
	.conv-preview { display: block; margin-top: 1px; color: var(--fg-muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

	.archived-toggle {
		display: flex; align-items: center; gap: 0.4rem;
		width: 100%; text-align: left;
		margin-top: 0.35rem;
		padding: 0.45rem 0.6rem;
		border-radius: 10px;
		font-size: 12px;
		color: var(--fg-subtle);
	}
	.archived-toggle:hover { background: var(--hover); color: var(--fg-muted); }
	.archived-toggle .count { font-family: var(--mono); font-size: 10px; }
	.archived-toggle .chev { margin-left: auto; transition: transform 120ms ease; }
	.archived-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
	.list ul.archived-list { display: none; }
	.list ul.archived-list.open { display: flex; }

	.rows { flex: 1; min-height: 0; overflow-y: auto; padding: 0.2rem 0.5rem 0.75rem; }
	.line-row {
		display: flex; align-items: center; gap: 0.5rem;
		width: 100%; min-height: 2.5rem; text-align: left;
		padding: 0.45rem 0.6rem;
		border-radius: 10px;
		font-size: 13px;
		color: var(--fg-muted);
	}
	.line-row:hover { background: var(--hover); color: var(--fg); }
	.line-row .t { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--fg-subtle); }
	.ghost-row {
		display: flex; align-items: center; gap: 0.5rem;
		width: 100%; min-height: 2.5rem; text-align: left;
		padding: 0.45rem 0.6rem;
		border-radius: 10px;
		font-size: 13px;
		color: var(--fg-subtle);
	}
	.ghost-row:hover { background: var(--hover); color: var(--fg-muted); }

	.stub { flex: 1; min-height: 0; overflow-y: auto; padding: 0.6rem 1rem; display: flex; flex-direction: column; gap: 0.55rem; }
	.stub .bar { height: 9px; border-radius: 5px; background: var(--hover); }
	.stub .note { font-family: var(--mono); font-size: 9.5px; color: var(--fg-subtle); margin-top: 0.4rem; }

	/* ---------- thread ---------- */
	.transcript { flex: 1; min-height: 0; overflow-y: auto; padding: 0.75rem 1rem; }
	.msg { margin-bottom: 1rem; }
	.who { font-family: var(--mono); font-size: 10px; color: var(--fg-subtle); margin-bottom: 0.2rem; }
	.msg p { margin: 0; }
	.composer { flex: none; padding: 0.6rem 1rem 2.1rem; }
	.composer .field { border: 1px solid var(--divider); border-radius: 12px; padding: 0.6rem 0.8rem; color: var(--fg-subtle); }

	/* ---------- the pill ---------- */
	.pill {
		position: absolute; right: 18px; bottom: 30px; z-index: 55;
		width: 52px; height: 52px;
		border-radius: 50%;
		background: var(--raise);
		border: 1px solid var(--divider);
		box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
		display: flex; align-items: center; justify-content: center;
		color: var(--fg-muted);
		transition: transform 120ms ease, color 75ms ease;
	}
	.pill:hover { color: var(--fg); transform: scale(1.04); }
	.pill .dot {
		position: absolute; top: 10px; right: 10px;
		width: 7px; height: 7px; border-radius: 50%;
		background: var(--accent);
	}
	.pill.hidden { display: none; }

	/* ---------- the tray ---------- */
	.tray-scrim {
		position: absolute; inset: 0; z-index: 50;
		background: rgba(0, 0, 0, 0.45);
		opacity: 0; pointer-events: none;
		transition: opacity 160ms ease;
	}
	.tray-scrim.open { opacity: 1; pointer-events: auto; }
	.tray {
		position: absolute; right: 14px; bottom: 96px; z-index: 55;
		width: 268px;
		background: var(--raise);
		border: 1px solid var(--divider);
		border-radius: 18px;
		padding: 0.45rem;
		transform-origin: 100% 100%;
		transform: scale(0.92) translateY(8px);
		opacity: 0; visibility: hidden; pointer-events: none;
		transition: transform 150ms ease, opacity 150ms ease, visibility 0s linear 150ms;
		box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
	}
	.tray.open {
		transform: none; opacity: 1; visibility: visible; pointer-events: auto;
		transition: transform 150ms ease, opacity 150ms ease;
	}
	.tray .tiles {
		display: grid; grid-template-columns: repeat(4, 1fr);
		gap: 2px;
	}
	.tile {
		display: flex; flex-direction: column; align-items: center; gap: 0.24rem;
		padding: 0.5rem 0 0.42rem;
		border-radius: 11px;
		font-size: 9.5px;
		color: var(--fg-muted);
		position: relative;
	}
	.tile:hover { background: var(--hover); color: var(--fg); }
	.tile.on { background: var(--active); color: var(--fg); }
	.tile.grow { background: var(--active-strong); color: var(--fg); }
	.tile.grow:hover { background: color-mix(in oklab, var(--fg) 14%, transparent); }
	.tile svg { display: block; }
	.tile .dot {
		position: absolute; top: 7px; right: calc(50% - 13px);
		width: 6px; height: 6px; border-radius: 50%;
		background: var(--accent);
	}
	.tray .tile-settings {
		grid-column: 1 / -1;
		flex-direction: row; justify-content: center; gap: 0.45rem;
		border-top: 1px solid var(--divider);
		border-radius: 0 0 11px 11px;
		margin-top: 2px;
		padding-top: 0.5rem;
		font-size: 11px;
	}
	.tray .tile-settings svg { width: 15px; height: 15px; }

	.home-pill {
		position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
		width: 128px; height: 5px; border-radius: 3px;
		background: color-mix(in oklab, var(--fg) 30%, transparent);
		z-index: 60; pointer-events: none;
	}

	@media (max-height: 940px), (max-width: 440px) {
		body { padding: 1rem 0.5rem; }
		.phone { transform: scale(min(1, calc((100dvh - 6rem) / 844))); transform-origin: top center; }
	}
</style>
</head>

					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v18H6.5A1.5 1.5 0 0 1 5 19.5v-15z"/><path d="M9 3v18"/></svg>
					Notes
				</button>

				<button type="button" class="tile" data-page="attention" data-surface="attention">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 19a2.2 2.2 0 0 0 4 0"/></svg>
					<span class="dot" aria-hidden="true"></span>
					Attention
				</button>
				<button type="button" class="tile" data-op="Delegations">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/></svg>
					Delegations
				</button>
				<button type="button" class="tile" data-op="Memories">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13.5l9 5 9-5"/></svg>
					Memories
				</button>
				<button type="button" class="tile" data-op="Programs">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M10 8.5l6 3.5-6 3.5v-7z"/></svg>
					Programs
				</button>

				<button type="button" class="tile" data-op="Skills">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H13L13 2z"/></svg>
					Skills
				</button>
				<button type="button" class="tile" data-op="Files">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M6 3h8l4 4v14H6V3z"/><path d="M14 3v4h4"/></svg>
					Files
				</button>
				<button type="button" class="tile" data-op="Status">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12L16 12h5"/></svg>
					Status
				</button>
				<button type="button" class="tile" data-op="Log">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3"/><path d="M13 15h4"/></svg>
					Log
				</button>

				<button type="button" class="tile tile-settings" data-op="Settings">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"/></svg>
					Settings
				</button>
			</div>
		</div>

		<button type="button" class="pill" id="pill" aria-haspopup="true" aria-expanded="false" aria-label="Open surfaces" title="Surfaces">
			<svg id="pillGlyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6z"/></svg>
			<span class="dot" id="pillDot" aria-hidden="true"></span>
		</button>

		<div class="home-pill" aria-hidden="true"></div>
	</div>
	<figcaption>O &middot; the summoned spine &mdash; no bar, no drawer; the gutter condenses into a pill and opens as a tray when called. Tap the pill, then a tile; open a chat.</figcaption>
</figure>

<script>
	const GLYPHS = {
		chats: '<path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6z"/>',
		projects: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>',
		notes: '<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v18H6.5A1.5 1.5 0 0 1 5 19.5v-15z"/><path d="M9 3v18"/>',
		attention: '<path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 19a2.2 2.2 0 0 0 4 0"/>',
	};

	const pages = [...document.querySelectorAll(".page")];
	const pill = document.getElementById("pill");
	const pillGlyph = document.getElementById("pillGlyph");
	const pillDot = document.getElementById("pillDot");
	const tray = document.getElementById("tray");
	const trayScrim = document.getElementById("trayScrim");
	const tiles = [...tray.querySelectorAll(".tile[data-surface], .tile[data-op]")];
	const moreTitle = document.getElementById("moreTitle");
	const moreNote = document.getElementById("moreNote");

	let current = "chats";

	function show(name) {
		for (const p of pages) p.classList.toggle("on", p.id === "page-" + name);
		pill.classList.toggle("hidden", name === "thread");
	}

	function setPillGlyph(surface) {
		if (GLYPHS[surface]) pillGlyph.innerHTML = GLYPHS[surface];
		pillDot.style.display = surface === "attention" ? "none" : "block";
	}

	function setTray(open) {
		tray.classList.toggle("open", open);
		trayScrim.classList.toggle("open", open);
		pill.setAttribute("aria-expanded", String(open));
		if (open) {
			for (const t of tiles) {
				t.classList.toggle("on", t.dataset.surface === current);
			}
		}
	}

	pill.addEventListener("click", () => setTray(!tray.classList.contains("open")));
	trayScrim.addEventListener("click", () => setTray(false));
	document.addEventListener("keydown", (e) => { if (e.key === "Escape") setTray(false); });

	function land(surface, name) {
		current = surface;
		setPillGlyph(surface);
		setTray(false);
		show(name);
	}
	for (const t of tiles) {
		t.addEventListener("click", () => {
			if (t.dataset.surface) {
				land(t.dataset.surface, t.dataset.page);
			} else {
				moreTitle.textContent = t.dataset.op;
				moreNote.textContent = t.dataset.op.toLowerCase() + " — stub";
				setTray(false);
				show("more");
			}
		});
	}

	for (const a of document.querySelectorAll("[data-thread]")) {
		a.addEventListener("click", (e) => { e.preventDefault(); show("thread"); });
	}
	document.getElementById("backBtn").addEventListener("click", () => show("chats"));

	const archToggle = document.getElementById("archivedToggle");
	const archList = document.getElementById("archivedList");
	archToggle.addEventListener("click", () => {
		const open = archList.classList.toggle("open");
		archToggle.setAttribute("aria-expanded", String(open));
	});
</script>
</body>
</html>
