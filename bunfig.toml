# Bun runs every test file of one invocation in a single process, and
# scopes a module-level afterEach to the file whose import first
# registered it: without this preload, files after the first leak all
# of their testkit fixture dirs (2026-10-22 /tmp ENOSPC
# incident — 86k leaked dirs, ~15GB). Loading the fixture module
# before any test file makes its cleanup hooks global to the run.
[test]
# test-memory-net.ts must swap bun:test's test/it/describe before anything
# imports bun:test; it also covers runaways in the later preloads.
# test-tmpdir.ts then points TMPDIR at RAM before anything reads os.tmpdir().
# test-dom-print.ts keeps failed assertions on happy-dom nodes from
# printing the whole app (#798); it must also load before anything
# imports bun:test as ESM (see its header), so before testkit.ts.
preload = [
	"./src/test-memory-net.ts",
	"./src/test-tmpdir.ts",
	"./app/src/test-dom-print.ts",
	"./app/src/test-dom-globals.ts",
	"./src/testkit.ts",
]
